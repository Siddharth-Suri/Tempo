<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tempo · Insights</title>
    <link rel="icon" href="icons/32.png" />
    <script src="prefs.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <script type="module" src="dashboard.js"></script>
  </head>
  <body>
    <main>
      <header class="top">
        <div>
          <p class="label">Tempo</p>
          <h1>Insights</h1>
        </div>
        <div id="period" class="seg"></div>
      </header>

      <section class="cards">
        <article class="card">
          <p class="label">Today</p>
          <p id="today" class="big num"></p>
          <p id="today-sub" class="sub"></p>
        </article>
        <article class="card">
          <p id="avg-label" class="label"></p>
          <p id="avg" class="big num"></p>
          <p id="avg-sub" class="sub"></p>
        </article>
        <article class="card">
          <p class="label">Today vs average</p>
          <p id="delta" class="big num"></p>
          <p id="delta-sub" class="sub"></p>
        </article>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Daily totals</h2>
          <span class="legend"><i></i>Average</span>
        </div>
        <div id="chart" class="chart"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>By site</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Site</th>
              <th>Today</th>
              <th>Avg / day</th>
              <th>Change</th>
            </tr>
          </thead>
          <tbody id="sites"></tbody>
        </table>
        <p id="empty" class="empty" hidden>No browsing recorded in this period yet.</p>
      </section>
    </main>
  </body>
</html>
