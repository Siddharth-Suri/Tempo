<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tempo</title>
    <script src="prefs.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <section id="home" class="view home">
      <header class="head">
        <div>
          <p class="label">Today</p>
          <h1 id="total" class="num">0m</h1>
          <p id="delta" class="chip num"></p>
        </div>
        <button id="open-settings" class="icon-button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M3 6h8M15 6h2M3 14h2M9 14h8" />
            <circle cx="13" cy="6" r="2" />
            <circle cx="7" cy="14" r="2" />
          </svg>
        </button>
      </header>

      <div class="card panel week">
        <div class="panel-head">
          <span class="label">Past week</span>
          <span class="legend"><i></i>Average</span>
        </div>
        <div id="chart" class="chart"></div>
      </div>

      <div class="card panel">
        <div class="panel-head">
          <span class="label">Top sites today</span>
        </div>
        <ol id="sites" class="sites"></ol>
        <p id="empty" class="empty" hidden>Nothing tracked yet today.</p>
      </div>
    </section>

    <section id="settings" class="view settings" inert>
      <header class="settings-head">
        <button id="close-settings" class="icon-button" aria-label="Back" title="Back">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4l-6 6 6 6" />
          </svg>
        </button>
        <h2>Settings</h2>
      </header>

      <div class="card panel setting">
        <p class="name">Idle pause</p>
        <p class="hint">Stop counting after no mouse or keyboard use.</p>
        <div id="idle" class="seg"></div>
      </div>

      <div class="card panel options">
        <div class="option">
          <span class="name">Theme</span>
          <div id="theme" class="seg"></div>
        </div>
        <label class="option">
          <span>
            <span class="name">Remove site icons</span>
            <span class="hint">Show site names only</span>
          </span>
          <input id="no-icons" class="switch" type="checkbox" />
        </label>
        <label class="option">
          <span>
            <span class="name">Compact mode</span>
            <span class="hint">Hide the weekly graph here</span>
          </span>
          <input id="compact" class="switch" type="checkbox" />
        </label>
      </div>

      <div class="card panel links">
        <button id="insights" class="link">
          <span>
            <span class="name">Full insights</span>
            <span class="hint">Month view, averages and every site</span>
          </span>
          <svg class="mark" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 13l6-6M8 7h5v5" />
          </svg>
        </button>
        <button id="support" class="link">
          <span>
            <span class="name">Support</span>
            <span class="hint">Back the developer</span>
          </span>
          <span class="mark star" aria-hidden="true">✧</span>
        </button>
      </div>
    </section>
  </body>
</html>
